    <style>
        :root {
            --hangyo-blue: #71D8DE;
            --hangyo-light-blue: #BBEFF2;
            --hangyo-dark-blue: #2CA8B0;
            --hangyo-coral: #FF8F9C;
            --hangyo-yellow: #FFE370;
            --hangyo-bg: #E8FAFC;
            --hangyo-border: #2A4858;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif, system-ui;
            background-color: var(--hangyo-bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(113, 216, 222, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 143, 156, 0.18) 0%, transparent 40%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* 水底漂浮氣泡動畫 */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            border: 2px solid rgba(113, 216, 222, 0.4);
            pointer-events: none;
            animation: floatUp 10s infinite linear;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 已解鎖關卡按鈕 (3D 卡通立體感 + Hover 閃光) */
        .level-btn-unlocked {
            background: linear-gradient(135deg, #A8F0F5 0%, #71D8DE 100%);
            border: 3.5px solid var(--hangyo-border);
            box-shadow: 0 6px 0 var(--hangyo-border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 閃光光芒掃過效果 */
        .level-btn-unlocked::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.65) 50%,
                transparent 55%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease;
        }

        .level-btn-unlocked:hover::before {
            transform: rotate(30deg) translateY(100%);
        }

        .level-btn-unlocked:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 0 var(--hangyo-border);
            background: linear-gradient(135deg, #BBEFF2 0%, #5ECBD2 100%);
        }

        .level-btn-unlocked:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--hangyo-border);
        }

        /* 未解鎖關卡按鈕樣式 (灰色與晃動效果) */
        .level-btn-locked {
            background: #E2E8F0;
            border: 3.5px solid #94A3B8;
            box-shadow: 0 5px 0 #94A3B8;
            border-radius: 20px;
            cursor: not-allowed;
            position: relative;
            transition: all 0.2s ease;
        }

        .level-btn-locked:hover {
            animation: lockWiggle 0.4s ease-in-out;
            background: #CBD5E1;
        }

        @keyframes lockWiggle {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px) rotate(-2deg); }
            40% { transform: translateX(4px) rotate(2deg); }
            60% { transform: translateX(-3px) rotate(-1deg); }
            80% { transform: translateX(3px) rotate(1deg); }
        }

        /* 大頭貼懸浮與邊框動畫 */
        .avatar-container {
            border: 5px solid var(--hangyo-border);
            box-shadow: 0 8px 0 var(--hangyo-border);
            animation: gentleBounce 3s ease-in-out infinite;
        }

        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 自訂彈出式 Toast 提示框 */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--hangyo-border);
            color: #FFF;
            text-align: center;
            border-radius: 50px;
            padding: 12px 24px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            font-weight: 700;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>

    <script>
        // 生成動態水底泡泡
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            const bubbleCount = 20;

            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                // 隨機尺寸 (8px ~ 32px)
                const size = Math.random() * 24 + 8;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                
                // 隨機水平位置
                bubble.style.left = `${Math.random() * 100}%`;
                
                // 隨機上升動畫時間 (6s ~ 14s) 與延遲
                const duration = Math.random() * 8 + 6;
                const delay = Math.random() * 5;
                bubble.style.animationDuration = `${duration}s`;
                bubble.style.animationDelay = `${delay}s`;

                container.appendChild(bubble);
            }
        }

        // 點擊未解鎖關卡的提示訊息
        let toastTimeout;
        function showLockedToast(weekNum) {
            const toast = document.getElementById('toast');
            toast.innerText = `🔒 Week ${weekNum} 關卡尚未解鎖，請繼續努力破關！`;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 頁面載入完成後啟動動畫
        window.onload = function() {
            createBubbles();
        };
    </script>
