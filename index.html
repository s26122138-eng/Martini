<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANGYODON 人魚漢頓作品集入口 🌊</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Zen Maru Gothic 圓體字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --hangyo-blue: #71D8DE;
            --hangyo-light-blue: #BBEFF2;
            --hangyo-dark-blue: #2CA8B0;
            --hangyo-coral: #FF8F9C;
            --hangyo-yellow: #FFE370;
            --hangyo-bg: #E8FAFC;
            --hangyo-border: #2A4858;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif, system-ui;
            background-color: var(--hangyo-bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(113, 216, 222, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 143, 156, 0.18) 0%, transparent 40%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* 水底漂浮氣泡動畫 */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            border: 2px solid rgba(113, 216, 222, 0.4);
            pointer-events: none;
            animation: floatUp 10s infinite linear;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 已解鎖關卡按鈕 (3D 卡通立體感 + Hover 閃光) */
        .level-btn-unlocked {
            background: linear-gradient(135deg, #A8F0F5 0%, #71D8DE 100%);
            border: 3.5px solid var(--hangyo-border);
            box-shadow: 0 6px 0 var(--hangyo-border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 閃光光芒掃過效果 */
        .level-btn-unlocked::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.65) 50%,
                transparent 55%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease;
        }

        .level-btn-unlocked:hover::before {
            transform: rotate(30deg) translateY(100%);
        }

        .level-btn-unlocked:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 0 var(--hangyo-border);
            background: linear-gradient(135deg, #BBEFF2 0%, #5ECBD2 100%);
        }

        .level-btn-unlocked:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--hangyo-border);
        }

        /* 未解鎖關卡按鈕樣式 (灰色與晃動效果) */
        .level-btn-locked {
            background: #E2E8F0;
            border: 3.5px solid #94A3B8;
            box-shadow: 0 5px 0 #94A3B8;
            border-radius: 20px;
            cursor: not-allowed;
            position: relative;
            transition: all 0.2s ease;
        }

        .level-btn-locked:hover {
            animation: lockWiggle 0.4s ease-in-out;
            background: #CBD5E1;
        }

        @keyframes lockWiggle {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px) rotate(-2deg); }
            40% { transform: translateX(4px) rotate(2deg); }
            60% { transform: translateX(-3px) rotate(-1deg); }
            80% { transform: translateX(3px) rotate(1deg); }
        }

        /* 大頭貼懸浮與邊框動畫 */
        .avatar-container {
            border: 5px solid var(--hangyo-border);
            box-shadow: 0 8px 0 var(--hangyo-border);
            animation: gentleBounce 3s ease-in-out infinite;
        }

        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 自訂彈出式 Toast 提示框 */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--hangyo-border);
            color: #FFF;
            text-align: center;
            border-radius: 50px;
            padding: 12px 24px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            font-weight: 700;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-between min-h-screen relative">

    <div id="bubbles-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <main class="w-full max-w-5xl z-10 flex flex-col items-center">
        
        <header class="text-center my-6 flex flex-col items-center">
            
            <!-- 個人大頭貼 -->
            <div class="relative group">
                <div class="avatar-container w-32 h-32 md:w-40 md:h-40 rounded-full overflow-hidden bg-white relative z-10">
                    <img 
                        src="https://placehold.co/200x200/71D8DE/2A4858?text=HANGYODON+🐟&font=Zen+Maru+Gothic" 
                        alt="My Avatar" 
                        class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110"
                        onerror="this.src='https://placehold.co/200x200/71D8DE/ffffff?text=Avatar';"
                    />
                </div>
                <!-- 人魚漢頓的好朋友 Sayuri 章魚小妹徽章 -->
                <div class="absolute -bottom-2 -right-2 z-20 bg-[#FF8F9C] border-2 border-[#2A4858] rounded-full px-3 py-1 text-xs font-bold text-white shadow-md flex items-center gap-1 transform rotate-6">
                    <span>🐙 Sayuri</span>
                </div>
            </div>

            <!-- 名字與主題標題 -->
            <div class="mt-5 space-y-2">
                <div class="inline-flex items-center gap-2 bg-white px-4 py-1.5 rounded-full border-2 border-[#2A4858] shadow-sm">
                    <span class="w-3 h-3 rounded-full bg-[#71D8DE] animate-ping"></span>
                    <span class="text-xs md:text-sm font-bold text-[#2A4858]">網頁程式設計作品集</span>
                </div>
                <h1 class="text-3xl md:text-5xl font-black text-[#2A4858] tracking-wide drop-shadow-sm">
                    人魚漢頓的闖關之旅 🌊
                </h1>
                <p class="text-sm md:text-base font-bold text-[#3B6E8C] max-w-md mx-auto">
                    歡迎來到我的 HANGYODON 作品集！完成每週任務解鎖新關卡，點擊關卡開啟網頁！
