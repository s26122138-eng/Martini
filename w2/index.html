<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？隨機抽籤機</title>
    
    <!-- 引入 Google Fonts (圓潤可愛字體) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- 樣式設定 (CSS) -->
    <style>
        /* ===== 全局與字體設定 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: #fef6e4; /* 柔和粉黃背景 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== 主要卡片外觀 (馬卡龍卡片風格) ===== */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(243, 218, 218, 0.7);
            border: 4px solid #fff3f5;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* ===== 標題文字風格 ===== */
        .title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f582ae; /* 馬卡龍草莓粉 */
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        /* 彈跳動畫類別 */
        .bounce {
            animation: popBounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== 美食圖片區域 ===== */
        .image-container {
            width: 100%;
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            border: 3px solid #e8e8e8;
            animation: fadeIn 0.5s ease-in-out;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 按鈕通用設定 ===== */
        .btn {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        /* 抽籤按鈕 (薄荷綠) */
        .btn-draw {
            background-color: #8bd3dd;
            color: #001858;
            box-shadow: 0 6px 0px #6bb2bc;
        }

        .btn-draw:hover {
            background-color: #a2e1e9;
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #6bb2bc;
        }

        .btn-draw:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #6bb2bc;
        }

        /* Google Map 按鈕 (馬卡龍橘黃) */
        .btn-map {
            background-color: #f3d2c1;
            color: #001858;
            box-shadow: 0 6px 0px #d8b4a0;
        }

        .btn-map:hover {
            background-color: #fadbcc;
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #d8b4a0;
        }

        .btn-map:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #d8b4a0;
        }

        /* 隱藏元素用 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 標題區域 -->
        <h1 id="main-title" class="title">今天吃什麼?</h1>

        <!-- 圖片顯示區域 (預設隱藏) -->
        <div id="image-container" class="image-container hidden">
            <img id="food-image" src="" alt="美食照片">
        </div>

        <!-- 抽籤按鈕 -->
        <button id="draw-btn" class="btn btn-draw">點我抽籤</button>

        <!-- Google Maps 導航按鈕 (預設隱藏) -->
        <a id="map-btn" class="btn btn-map hidden" href="#" target="_blank" rel="noopener noreferrer">
            📍 馬上出發 (Google Map)
        </a>
    </div>
