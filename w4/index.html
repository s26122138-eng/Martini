<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 💬</title>

  <!-- 引入 Google Fonts 圓體字型 (Zen Maru Gothic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       【1. 全局樣式與主題色設定】
       如需調整主題顏色，請直接修改下方 CSS 變數
       ========================================== */
    :root {
      --bg-color: #e0f2fe;        /* 頁面主要背景色：淡藍色 */
      --dot-color: #ffffff;       /* 背景波點顏色：白色 */
      --card-bg: rgba(255, 255, 255, 0.92); /* 卡片背景色：半透明白 */
      --primary-color: #0284c7;  /* 主題文字/邊框顏色：深天藍色 */
      --highlight-color: #00d2ff;/* 輪播高亮邊框/發光顏色：霓虹藍色 (可自由更換，例如 #ff007f 霓虹粉) */
      --text-color: #2A4858;     /* 內文主要文字顏色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif, system-ui;
      min-height: 100vh;
      padding: 20px;
      color: var(--text-color);

      /* 【淡藍色與白色波點背景】 */
      background-color: var(--bg-color);
      background-image: radial-gradient(var(--dot-color) 22%, transparent 22%);
      background-size: 24px 24px; /* 控制波點的密度與大小 */
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 35px;
    }

    header h1 {
      color: var(--primary-color);
      font-size: 2.2rem;
      font-weight: 900;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    /* ==========================================
       【2. 載入中 Cool 動畫設定】
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 100px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.6);
      border-top: 6px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
