<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 💬</title>

  <!-- 引入 Google Fonts 圓體字型 (Zen Maru Gothic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       【1. 全局樣式與主題色設定】
       若需要修改網頁顏色風格，請直接調整下方 CSS 變數 (CSS Variables)
       ========================================================================== */
    :root {
      /* 背景主要顏色：淡藍色 */
      --bg-color: #e0f2fe;

      /* 背景波點顏色：白色 */
      --dot-color: #ffffff;

      /* 波點的大小與間距 (點的大小 22%, 網格大小 24px) */
      --dot-size: 24px;

      /* 卡片背景顏色：92% 不透明度的白色，呈現清爽質感 */
      --card-bg: rgba(255, 255, 255, 0.92);

      /* 主題標題與名字的顏色：深天藍色 */
      --primary-color: #0284c7;

      /* 留言內文主要文字顏色 */
      --text-color: #2A4858;

      /* 
        【輪播高亮主題色】
        當卡片被選中時的發光顏色 (可改為 #ff007f 霓虹粉, #f59e0b 亮黃等) 
      */
      --highlight-color: #00d2ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif, system-ui;
      min-height: 100vh;
      padding: 24px 16px;
      color: var(--text-color);

      /* 【淡藍色與白色波點背景】使用 radial-gradient 製作 */
      background-color: var(--bg-color);
      background-image: radial-gradient(var(--dot-color) 22%, transparent 22%);
      background-size: var(--dot-size) var(--dot-size);
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 35px;
    }

    header h1 {
      color: var(--primary-color);
      font-size: 2.2rem;
      font-weight: 900;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    /* ==========================================================================
       【2. 載入中 Cool 動畫設定】
       ========================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 100px;
    }

    /* 旋轉微光外圈 */
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.6);
      border-top: 6px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 呼吸燈文字 */

      font-size: 1.2rem;
      font-weight: 700;
